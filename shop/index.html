<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBasket | Fresh & Organic</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="promo-bar">
        <p>🚀 Free Delivery on orders over R500!</p>
    </div>

    <nav class="navbar">
        <div class="logo">Green<span>Basket</span></div>
        <div class="search-box">
            <input type="text" id="global-search" placeholder="Search for fresh groceries...">
            <button id="search-btn"><i data-lucide="search"></i> Search</button>
        </div>
        <div class="nav-actions">
            <div class="icon-item"><i data-lucide="user"></i></div>
            <div class="icon-item"><i data-lucide="heart"></i></div>
            <div class="icon-item cart-trigger" id="cart-btn">
                <i data-lucide="shopping-basket"></i>
                <span id="cart-count">0</span>
            </div>
            <button class="account-btn"><i data-lucide="user-check"></i> My Account</button>
        </div>
    </nav>

    <div class="category-ribbon">
        <div class="scroll-container" id="category-list">
            </div>
    </div>

    <header class="hero" id="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content" id="hero-data">
            <span class="badge">ORGANIC PICKS</span>
            <h1>Pure <span>Organic</span> Living, Every Day</h1>
            <p>Discover our certified organic range — no pesticides, no GMOs.</p>
            <div class="hero-btns">
                <button class="btn-primary">Shop Organic</button>
                <button class="btn-secondary">Learn More</button>
            </div>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="section-header">
            <h2>All Products 🛒</h2>
            <select class="sort-dropdown"><option>Sort: Default</option></select>
        </div>
        <div id="product-grid" class="product-grid">
            </div>
    </main>

    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Your Bag</h3>
            <button id="close-cart">&times;</button>
        </div>
        <div id="cart-items" class="cart-scroll"></div>
        <div class="cart-footer">
            <div class="total-box"><span>Total:</span> <span id="cart-total">R0.00</span></div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
